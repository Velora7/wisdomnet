{
  "device.name": "wisdomnet-sensor",
  "device.node_id": "wisdomnet-01",

  "ftp.enabled": true,
  "ftp.port": 2121,
  "ftp.banner": "FTP server ready",

  "http.enabled": true,
  "http.port": 8080,
  "http.skin": "nasLogin",

  "ssh.enabled": false,
  "ssh.port": 2222,
  "ssh.version": "SSH-2.0-OpenSSH_8.2p1 Ubuntu-4ubuntu0.5",

  "mysql.enabled": true,
  "mysql.port": 3306,

  "logger": {
    "class": "PyLogger",
    "kwargs": {
      "formatters": {
        "plain": {
          "format": "%(message)s"
        }
      },
      "handlers": {
        "file": {
          "class": "logging.FileHandler",
          "filename": "/var/log/opencanary/opencanary.log"
        }
      }
    }
  }
}
